<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="hypGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <!-- Outer tesseract cube projection -->
  <polygon points="120,24 204,72 204,168 120,216 36,168 36,72" stroke="url(#hypGrad)" stroke-width="2.5" fill="rgba(168, 85, 247, 0.1)" />
  <!-- Inner cube -->
  <polygon points="120,64 168,92 168,148 120,176 72,148 72,92" stroke="#38bdf8" stroke-width="2" fill="rgba(56, 189, 248, 0.15)" />
  <!-- Dimensional struts -->
  <line x1="120" y1="24" x2="120" y2="64" stroke="#f8fafc" stroke-width="1.5" />
  <line x1="204" y1="72" x2="168" y2="92" stroke="#f8fafc" stroke-width="1.5" />
  <line x1="204" y1="168" x2="168" y2="148" stroke="#f8fafc" stroke-width="1.5" />
  <line x1="120" y1="216" x2="120" y2="176" stroke="#f8fafc" stroke-width="1.5" />
  <line x1="36" y1="168" x2="72" y2="148" stroke="#f8fafc" stroke-width="1.5" />
  <line x1="36" y1="72" x2="72" y2="92" stroke="#f8fafc" stroke-width="1.5" />
  <!-- Center vertex -->
  <circle cx="120" cy="120" r="14" fill="url(#hypGrad)" stroke="#ffffff" stroke-width="2" />
</svg>
