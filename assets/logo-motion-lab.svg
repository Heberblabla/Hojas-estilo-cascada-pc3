<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="logoGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="logoGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer hexagonal frame -->
  <polygon points="60,6 107,33 107,87 60,114 13,87 13,33" stroke="url(#logoGrad1)" stroke-width="2.5" fill="rgba(15, 23, 42, 0.7)" />
  <!-- Inner orbital rings -->
  <ellipse cx="60" cy="60" rx="38" ry="16" transform="rotate(-30 60 60)" stroke="url(#logoGrad2)" stroke-width="2" stroke-dasharray="6 4" />
  <ellipse cx="60" cy="60" rx="38" ry="16" transform="rotate(30 60 60)" stroke="url(#logoGrad1)" stroke-width="2" />
  <!-- Central prism diamond -->
  <polygon points="60,28 82,60 60,92 38,60" fill="url(#logoGrad1)" fill-opacity="0.22" stroke="#f8fafc" stroke-width="2" filter="url(#logoGlow)" />
  <!-- Core singularity -->
  <circle cx="60" cy="60" r="8" fill="#f8fafc" filter="url(#logoGlow)" />
  <circle cx="60" cy="60" r="4" fill="#38bdf8" />
  <!-- Corner accent nodes -->
  <circle cx="60" cy="6" r="3" fill="#38bdf8" />
  <circle cx="107" cy="33" r="3" fill="#818cf8" />
  <circle cx="107" cy="87" r="3" fill="#f472b6" />
  <circle cx="60" cy="114" r="3" fill="#2dd4bf" />
  <circle cx="13" cy="87" r="3" fill="#818cf8" />
  <circle cx="13" cy="33" r="3" fill="#38bdf8" />
</svg>
