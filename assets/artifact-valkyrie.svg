<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="valkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <!-- Speed lines -->
  <line x1="20" y1="180" x2="95" y2="105" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <line x1="145" y1="135" x2="220" y2="60" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <!-- Hyper-blade wings -->
  <polygon points="195,35 135,115 160,140" fill="rgba(244, 63, 94, 0.25)" stroke="url(#valkGrad)" stroke-width="2" />
  <polygon points="195,35 125,105 100,80" fill="rgba(56, 189, 248, 0.25)" stroke="url(#valkGrad)" stroke-width="2" />
  <!-- Main kinetic lance -->
  <polygon points="205,25 115,155 85,125" fill="url(#valkGrad)" fill-opacity="0.35" stroke="#f8fafc" stroke-width="2" />
  <polygon points="45,195 105,115 125,135" fill="rgba(236, 72, 153, 0.3)" stroke="url(#valkGrad)" stroke-width="2" />
  <!-- Core node -->
  <circle cx="118" cy="122" r="10" fill="#f8fafc" />
  <circle cx="118" cy="122" r="5" fill="#f43f5e" />
</svg>
